# Rclone Configuration Template
# 
# Instructions:
# 1. Install rclone on your system
# 2. Run: rclone config
# 3. Follow the setup wizard
# 4. Copy the generated config here
#
# Example Google Drive config:
# [gdrive]
# type = drive
# client_id = YOUR_CLIENT_ID
# client_secret = YOUR_CLIENT_SECRET
# scope = drive
# token = YOUR_TOKEN
# team_drive = 
#
# Example Mega config:
# [mega]
# type = mega
# user = your@email.com
# pass = your_password
#
# Example OneDrive config:
# [onedrive]
# type = onedrive
# client_id = YOUR_CLIENT_ID
# client_secret = YOUR_CLIENT_SECRET
# token = YOUR_TOKEN
# drive_id = YOUR_DRIVE_ID
# drive_type = personal
